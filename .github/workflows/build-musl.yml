name: Build musl binaries

# Daily at 05:00 Asia/Shanghai: 21:00 UTC the day before. GitHub's scheduler is
# best-effort and can start minutes late; the run is cheap when there is
# nothing new, so lateness does not matter.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "@cline/cli version to build (default: latest on npm)"
        required: false
      force:
        description: Rebuild even when this version already has a release
        type: boolean
        default: false

permissions:
  contents: write # create the release and its tag
  id-token: write # provenance attestation
  attestations: write

# One build at a time: a second run would compile the same version and race for
# the same release tag.
concurrency:
  group: build-musl
  cancel-in-progress: false

env:
  # The Bun version cline/cline's own publish workflow uses. Track it: a musl
  # target is only meaningful with a Bun that still ships that target.
  BUN_VERSION: "1.4.2"
  KEEP_RELEASES: "5"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cline-build
        uses: actions/checkout@v4

      # Resolve what to build before spending a runner on it. Two questions:
      # which version is current, and is there already a release for it.
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -eu
          VERSION="${REQUESTED:-$(curl -fsSL https://registry.npmjs.org/@cline/cli/latest | jq -r .version)}"
          case "$VERSION" in
            *[!0-9A-Za-z.-]*|'') echo "implausible version: '$VERSION'" >&2; exit 1 ;;
          esac
          TAG="v${VERSION}-musl.1"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # npm can publish a version a few minutes before the git tag appears.
          if ! git ls-remote --exit-code --tags https://github.com/cline/cline "refs/tags/cli-v${VERSION}" >/dev/null; then
            echo "cline/cline has no tag cli-v${VERSION} yet; nothing to build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FORCE" != "true" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        if: steps.version.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Check out cline/cline at the release tag
        if: steps.version.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: cline/cline
          ref: cli-v${{ steps.version.outputs.version }}
          path: cline
          fetch-depth: 1

      # The one source change a musl build needs. It is applied by an anchored
      # insertion so upstream moving the code around fails here, loudly, rather
      # than producing a glibc binary under a musl name.
      - name: Apply the musl libc patch
        if: steps.version.outputs.skip != 'true'
        run: node scripts/patch-cline.mjs cline

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        working-directory: cline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun install

      - name: Compile the musl binaries
        if: steps.version.outputs.skip != 'true'
        env:
          CLINE_TAG: cli-v${{ steps.version.outputs.version }}
        run: bun run scripts/build-musl.ts cline out

      # A binary that cannot start is the failure worth catching here. The
      # runner is glibc, so the smoke test runs inside Alpine, which is musl;
      # arm64 is checked on a real device instead (qemu would only prove the
      # loader, not the app).
      - name: Smoke-test the x64 binary under musl
        if: steps.version.outputs.skip != 'true'
        run: |
          set -eu
          got="$(docker run --rm -v "$PWD/out:/o:ro" alpine:3.20 sh -c 'apk add --no-cache libstdc++ >/dev/null && /o/cli-linux-x64-musl --version')"
          echo "$got"
          echo "$got" | grep -q "${{ steps.version.outputs.version }}"

      - name: Attest the binaries
        if: steps.version.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/cli-linux-x64-musl
            out/cli-linux-arm64-musl

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          gh release create "$TAG" \
            --title "Cline CLI ${VERSION} (musl, unofficial)" \
            --notes-file out/RELEASE_NOTES.md \
            out/cli-linux-x64-musl \
            out/cli-linux-arm64-musl \
            out/SHA256SUMS \
            out/manifest.json \
            cline/LICENSE

      # Each release carries two ~100 MiB binaries; keep the last few and drop
      # the rest so the repository does not grow without bound.
      - name: Prune old releases
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release list --limit 100 --json tagName -q '.[].tagName' \
            | grep -- '-musl\.' \
            | tail -n +$((KEEP_RELEASES + 1)) \
            | while read -r tag; do
                echo "deleting $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
